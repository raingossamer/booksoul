server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传上限要和后端 BOOKSOUL_MAX_UPLOAD_MB（默认 100）对齐。
    # 小了会变成一个 413：前端的上传前校验放行了，nginx 却在后端看见之前就拦下，
    # 于是用户收到的不是那句「这本书超过 100 MB」，而是一个没人解释的错误。
    client_max_body_size 128m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- 这三行是这个项目的命门，删掉不会报错，只会让流式变成一次性 ----
        # 解析进度与对话输出都是 SSE。nginx 默认开 proxy_buffering，
        # 它会把上游的响应先攒进缓冲区再一次性吐出来 —— 于是逐字生成的回答
        # 会在最后一刻整段出现，而「逐字流出来」正是这个产品的立意。
        # 症状上它看起来只是「有点慢」，没有任何一处报错。
        proxy_buffering off;
        proxy_cache off;
        # 一轮对读三路并发，加上选章读盘，几十秒是常态。默认 60s 会把长回答掐断。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA 回退：路由是 createWebHistory()，/books/3/read/2 这类深链在磁盘上
    # 没有对应文件，必须回 index.html 交给 vue-router。
    # 注意这条**在 /api/ 之后**：上面那个 location 前缀更长，优先匹配，
    # 所以一个打错的接口路径仍然从后端拿到规规矩矩的 404，而不是一张 HTML。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带哈希名的构建产物可以放心长缓存；index.html 绝不能，
    # 否则发新版之后浏览器还拿着旧的那份入口去引用已经不存在的 chunk。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
